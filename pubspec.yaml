name: uniflow_mobile
description: UniFlow - Gestion académique (Flutter)
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.17
  connectivity_plus: ^7.3.1
  workmanager: ^0.9.0+3
  livekit_client: ^2.9.0
  dio: ^5.4.0
  freezed_annotation: ^2.4.1
  flutter_dotenv: ^6.0.1
  appwrite: ^26.2.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.2
  file_picker: ^13.0.0
  flutter_local_notifications: ^22.3.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Sonde réseau : `flutter test` court-circuite HTTP (tout appel rend 400),
  # ce qui rend invisible une panne d'API. Ces tests-là s'exécutent sur
  # l'appareil, avec le vrai réseau, et montrent l'erreur réelle.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.8
  # Pas de `flutter_launcher_icons` ici, volontairement : les icônes sont
  # produites par `tools/generer-icones-uniflow.py`, seul propriétaire du jeu
  # d'icônes. La configuration précédente nommait `android: "launcher_icon"`
  # et écrivait `ios: true` — un dossier `ios/` qui n'existe pas — alors que le
  # manifeste et `res/mipmap-*/` disent `ic_launcher`. Lancé, il aurait créé un
  # second jeu d'icônes parallèle, et l'application aurait affiché l'ancien logo
  # selon la densité retenue par le lanceur. Il ignore de toute façon les
  # icônes adaptatives (`mipmap-anydpi-v26`) que le script, lui, sait générer.

flutter:
  uses-material-design: true
  assets:
    - .env
    # Logos de marque transparents (l'écusson court et le logo long). Le PNG à
    # fond blanc opaque `assets/logo.png` qu'ils remplacent est supprimé : il
    # pesait 872 Ko dans l'APK et posait une tuile blanche sur les fonds
    # sombres.
    - assets/brand/
